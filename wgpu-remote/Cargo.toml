[package]
name = "wgpu-remote"
edition.workspace = true
rust-version.workspace = true
keywords.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
version.workspace = true
authors.workspace = true

[features]
default = ["serde"]

[[bin]]
name = "parse-webidl"
path = "webidl/main.rs"

[dependencies]
hashbrown = { workspace = true }
weedle = "0.13"

[dependencies.serde]
optional = true
version = "1.0"
features = ["derive"]

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.29", features = ["fs", "mman", "process", "socket", "uio"] }

[[test]]
name = "unix-send-shmem"
path = "tests/unix-send-shmem.rs"
harness = false

[lints]
workspace = true
